<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscar Post</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    input, button {
      padding: 8px;
    }
    #resultado {
      margin-top: 20px;
    }
    .erro {
      color: red;
    }
  </style>
</head>
<body>
  <h1>Buscar post por ID</h1>
 
  <input type="number" id="campoId" placeholder="Digite o ID">
  <button id="btnBuscar">Buscar</button>
 
  <div id="resultado"></div>
 
  <script>
    const posts = [
      { userId: 1, id: 1, title: "Primeiro post", body: "Aprendendo a manipular o DOM." },
      { userId: 1, id: 2, title: "Segundo post", body: "Arrays de objetos são parecidos com o JSON de uma API." },
      { userId: 2, id: 3, title: "Terceiro post", body: "Em breve vamos buscar estes dados no servidor." },
      { userId: 2, id: 4, title: "Quarto post", body: "O método find devolve o primeiro item encontrado." },
      { userId: 3, id: 5, title: "Quinto post", body: "Se nada for encontrado, find devolve undefined." }
    ];
 
    const campoId = document.getElementById("campoId");
    const resultado = document.getElementById("resultado");
 
    function buscar() {
      const valor = campoId.value.trim();
      resultado.innerHTML = "";
 
      if (valor === "") {
        const p = document.createElement("p");
        p.textContent = "Digite um ID.";
        resultado.appendChild(p);
        return;
      }
 
      const post = posts.find(function (p) {
        return p.id === Number(valor);
      });
 
      if (!post) {
        const p = document.createElement("p");
        p.className = "erro";
        p.textContent = "Post não encontrado (ID " + valor + "). Os IDs válidos vão de 1 a 5.";
        resultado.appendChild(p);
        return;
      }
 
      const titulo = document.createElement("h2");
      titulo.textContent = post.title;
 
      const corpo = document.createElement("p");
      corpo.textContent = post.body;
 
      resultado.appendChild(titulo);
      resultado.appendChild(corpo);
    }
 
    document.getElementById("btnBuscar").addEventListener("click", buscar);
  </script>
</body>
</html>
