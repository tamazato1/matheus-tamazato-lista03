<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comentários por Post</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    select {
      padding: 8px;
    }
    #comentarios {
      margin-top: 20px;
    }
    .comentario {
      border: 1px solid gray;
      padding: 12px;
      margin-bottom: 10px;
      max-width: 500px;
    }
    .comentario h3 {
      margin: 0 0 4px;
    }
    .comentario .email {
      color: gray;
      font-size: 0.9em;
      margin: 0 0 8px;
    }
    .comentario p:last-child {
      margin: 0;
    }
  </style>
</head>
<body>
  <h1>Comentários por post</h1>
 
  <select id="post"></select>
 
  <div id="comentarios"></div>
 
  <script>
    const posts = [
      { id: 1, title: "Introdução ao DOM" },
      { id: 2, title: "Eventos em JavaScript" },
      { id: 3, title: "O que é uma API?" }
    ];
 
    const comentarios = [
      { postId: 1, id: 1, name: "Ana", email: "ana@email.com", body: "Explicação muito clara!" },
      { postId: 1, id: 2, name: "Bruno", email: "bruno@email.com", body: "Gostei do exemplo do getElementById." },
      { postId: 2, id: 3, name: "Carla", email: "carla@email.com", body: "addEventListener é bem melhor que onclick." },
      { postId: 3, id: 4, name: "Diego", email: "diego@email.com", body: "A analogia do garçom ajudou muito." },
      { postId: 3, id: 5, name: "Elisa", email: "elisa@email.com", body: "Quero testar o JSONPlaceholder!" },
      { postId: 3, id: 6, name: "Fábio", email: "fabio@email.com", body: "E o método POST, como funciona?" }
    ];
 
    const select = document.getElementById("post");
    const area = document.getElementById("comentarios");
 
    // Opção inicial
    const opcaoInicial = document.createElement("option");
    opcaoInicial.value = "";
    opcaoInicial.textContent = "Selecione um post";
    select.appendChild(opcaoInicial);
 
    // Opções geradas a partir do array posts
    posts.forEach(function (post) {
      const opcao = document.createElement("option");
      opcao.value = post.id;
      opcao.textContent = post.title;
      select.appendChild(opcao);
    });
 
    select.addEventListener("change", function () {
      area.innerHTML = "";
 
      if (select.value === "") {
        return;
      }
 
      const doPost = comentarios.filter(function (c) {
        return c.postId === Number(select.value);
      });
 
      const titulo = document.createElement("h2");
      titulo.textContent = "Comentários (" + doPost.length + ")";
      area.appendChild(titulo);
 
      doPost.forEach(function (c) {
        const card = document.createElement("div");
        card.className = "comentario";
 
        const nome = document.createElement("h3");
        nome.textContent = c.name;
 
        const email = document.createElement("p");
        email.className = "email";
        email.textContent = c.email;
 
        const texto = document.createElement("p");
        texto.textContent = c.body;
 
        card.appendChild(nome);
        card.appendChild(email);
        card.appendChild(texto);
        area.appendChild(card);
      });
    });
  </script>
</body>
</html>
